name: main

on:
  push:
    branches: [ main ]

env:
  GO_VERSION: 1.21
  NUSHELL_VERSION: 0.113.0

jobs:
  build:
    name: pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up go
        uses: actions/setup-go@v5
        with:
          cache-dependency-path: go.sum
          go-version: ${{ env.GO_VERSION }}

      - name: set up nushell
        uses: hustcer/setup-nu@v3
        with:
          version: ${{ env.NUSHELL_VERSION }}

      - name: set up path
        run: |
          mkdir bin
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: provision
        run: make provision

      - name: check
        run: make check

      - name: test
        run: make test

      - name: build prerelease
        run: |
          make build
          sbot version
          sbot update version --debug

      - name: build all
        run: |
          make build-all
          cp bin/sbot-linux-amd64 bin/sbot
          sbot version

      - name: release
        run: |
          sbot update version --debug
          sbot release version --debug
          sbot push version --debug

      - name: publish github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(git describe --tags --exact-match HEAD)"
          echo "publishing release for tag ${tag}"

          # remove the unsuffixed local binary so it does not get uploaded
          rm -f bin/sbot

          (cd bin && sha256sum sbot-* > SHA256SUMS)

          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${tag}" \
            --generate-notes \
            bin/sbot-linux-amd64 \
            bin/sbot-linux-arm64 \
            bin/sbot-darwin-amd64 \
            bin/sbot-darwin-arm64 \
            bin/sbot-windows-amd64.exe \
            bin/sbot-windows-arm64.exe \
            bin/SHA256SUMS
